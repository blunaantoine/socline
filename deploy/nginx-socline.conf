# ============================================================
# Socline — Reverse proxy nginx (à placer dans /etc/nginx/conf.d/socline.conf)
# ============================================================
# Le port PUBLIC est 3002 (comme demandé) : http://IP_DU_VPS:3002
# Le routage réplique exactement le gateway de développement :
#   - requêtes avec  ?XTransformPort=3003  -> service chat temps réel
#   - requêtes avec  ?XTransformPort=3005  -> service socket washgo
#   - tout le reste                        -> application Next.js
#
# Remplacez __PUBLIC_PORT__ (3002) et __WEB_PORT__ (3000) si besoin.

# Requis pour les websockets (socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Routage par query string — identique au gateway de dev (XTransformPort)
map $arg_XTransformPort $socline_backend {
    default   127.0.0.1:__WEB_PORT__;
    "3003"    127.0.0.1:3003;
    "3005"    127.0.0.1:3005;
}

server {
    listen __PUBLIC_PORT__;
    listen [::]:__PUBLIC_PORT__;
    server_name _;

    # Taille max des requêtes (photos, formulaires…)
    client_max_body_size 25M;

    location / {
        proxy_pass http://$socline_backend;

        proxy_http_version 1.1;

        # Headers standards
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websockets (socket.io : chat + suivi laveur en temps réel)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts généreux pour les connexions socket.io longue durée
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        proxy_buffering off;
    }
}
