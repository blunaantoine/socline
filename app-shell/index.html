<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Socline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FF9800; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #fff; text-align: center; padding: 24px; gap: 18px;
    }
    .logo {
      width: 96px; height: 96px; border-radius: 22px; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 800; letter-spacing: -2px; color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    h1 { font-size: 26px; font-weight: 800; }
    p { font-size: 15px; opacity: .92; max-width: 280px; line-height: 1.5; }
    a.btn {
      display: inline-block; margin-top: 6px; padding: 14px 28px; border-radius: 999px;
      background: #fff; color: #E65100; font-weight: 700; text-decoration: none; font-size: 15px;
      box-shadow: 0 6px 18px rgba(0,0,0,.18);
    }
  </style>
  <!-- Redirection automatique vers la plateforme Socline (l'APK pointe directement sur le site ;
       cette page n'est visible que si la WebView démarre sur le contenu embarqué) -->
  <meta http-equiv="refresh" content="2;url=https://socline.oquitogo.com/" />
</head>
<body>
  <div class="logo" aria-hidden="true">SC</div>
  <h1>Socline</h1>
  <p>Votre lavage auto, livré à votre porte. Ouverture de la plateforme…</p>
  <a class="btn" href="https://socline.oquitogo.com/">Ouvrir Socline</a>
