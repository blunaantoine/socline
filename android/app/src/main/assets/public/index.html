<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF9800" />
  <title>Socline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #FF9800 0%, #F57C00 60%, #E65100 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }
    .wrap { padding: 24px; max-width: 420px; }
    .logo {
      width: 84px; height: 84px; margin: 0 auto 20px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }
    h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    p  { font-size: 15px; opacity: 0.92; line-height: 1.5; }
    .spinner {
      width: 34px; height: 34px; margin: 26px auto 0;
      border: 4px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .retry {
      display: none;
      margin: 26px auto 0;
      padding: 12px 28px;
      font-size: 15px; font-weight: 700;
      color: #E65100; background: #fff;
      border: none; border-radius: 999px;
      cursor: pointer;
    }
    .offline { display: none; margin-top: 18px; font-size: 13.5px; opacity: 0.95; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🚗</div>
    <h1>Socline</h1>
    <p>Connexion au serveur…</p>
    <div class="spinner" id="spinner"></div>
    <p class="offline" id="offline">
      Impossible de joindre le serveur.<br />Vérifiez votre connexion Internet puis réessayez.
    </p>
    <button class="retry" id="retry" onclick="location.reload()">Réessayer</button>
  </div>

  <script>
    // Page de secours embarquée dans l'APK : bascule immédiatement vers
    // l'application hébergée sur le serveur distant.
    (function () {
      var TARGET = 'https://socline.oquitogo.com';
      function go() { window.location.replace(TARGET); }
      function fail() {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('offline').style.display = 'block';
        document.getElementById('retry').style.display = 'inline-block';
      }
      var t = setTimeout(fail, 8000);
      window.addEventListener('load', function () {
        clearTimeout(t);
        setTimeout(go, 600);
      });
    })();
  </script>
</body>
</html>
